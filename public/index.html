<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Базовый путь сайта подставляется скриптом scripts/finalize-web.mjs после `expo export`. -->
    <link rel="manifest" href="%BASE_URL%/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Athlete Coach" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0b0f14;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      // Офлайн-режим: service worker кэширует приложение после первого открытия.
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('%BASE_URL%/sw.js', { scope: '%BASE_URL%/' }).catch(function () {});
        });
      }
    </script>
  </head>

  <body>
    <noscript>Для работы приложения включите JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
