name: Android APK

# Собирает устанавливаемый APK без аккаунтов и секретов: expo prebuild + Gradle.
# Сборки из main публикуются в GitHub Releases, из pull request — в артефакты запуска.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.js'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: >
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk athlete-coach.apk
          ls -lh athlete-coach.apk

      - uses: actions/upload-artifact@v4
        with:
          name: athlete-coach-apk
          path: athlete-coach.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Athlete Coach для Android (сборка ${{ github.run_number }})
          make_latest: true
          files: athlete-coach.apk
          body: |
            Установка: скачайте `athlete-coach.apk` на телефон и откройте его.
            Android попросит разрешить установку из этого источника — разрешите.

            Сборка из коммита ${{ github.sha }}.
